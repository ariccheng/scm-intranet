<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#191919">
  <title></title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="assets/fonts/ibm-plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/scene.css">
  <link rel="stylesheet" href="assets/css/overlay.css">
  <link rel="stylesheet" href="assets/css/desk-items.css">
  <link rel="stylesheet" href="assets/css/os.css">
  <link rel="stylesheet" href="assets/css/apps.css">
  <style>
    /* shown only if the app never starts: no JavaScript, a missing module, or the file opened from disk */
    #boot-error { position: fixed; inset: 0; z-index: 99; display: grid; place-content: center; gap: 10px; padding: 24px;
      background: #191919; color: #E8E8E8; font: 16px/1.5 system-ui, sans-serif; text-align: center;
      visibility: hidden; animation: boot-late 0s 4s forwards; }
    #boot-error code { background: #333; padding: 1px 6px; border-radius: 4px; }
    html.booted #boot-error { display: none; }
    html.boot-failed #boot-error { animation: none; visibility: visible; }
    @keyframes boot-late { to { visibility: visible; } }
  </style>
</head>
<body>
  <div id="intro" hidden></div>
  <div id="viewport" hidden></div>
  <div id="os" hidden></div>
  <div id="layer-root"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="boot-error" role="alert">
    <p>This page could not start.</p>
    <p>If you opened the file from your computer, run <code>python3 -m http.server</code> in this folder and visit <code>http://localhost:8000/</code>. Otherwise, reload the page.</p>
    <p id="boot-detail"></p>
  </div>
  <noscript><p class="noscript">This site needs JavaScript.</p></noscript>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
